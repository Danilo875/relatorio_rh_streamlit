<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#f5f8f6;--plane:#fff;--plane-2:#eef4f0;--stroke:#dbe7e0;--ink:#0f261c;--ink-2:#3d5a4d;--muted:#5f7469;
  --acc:#067a58;--acc-2:#0d9488;--good:#047857;--bad:#dc2626;--warn:#b45309;--good-bg:rgba(5,150,105,.1);
  --track:#e4ede8;--grid:#eef4f0;--radius:12px;--bw:1px;
  --shadow:0 1px 2px rgba(15,38,28,.04),0 12px 28px -14px rgba(5,150,105,.16);
  --c1:#067a58;--c2:#0369a1;--c3:#047857;--c4:#b45309;--c5:#7c3aed;--fem:#a8337d;--masc:#1e90ff;--icon-filter:none;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1712;--plane:#14231c;--plane-2:#1a2e25;--stroke:#274034;--ink:#e8f3ed;--ink-2:#b4cbbf;--muted:#8aa498;
  --acc:#34d399;--acc-2:#2dd4bf;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--good-bg:rgba(52,211,153,.12);--track:#23382e;--grid:#1f332a;
  --shadow:0 1px 2px rgba(0,0,0,.3);--c1:#34d399;--c2:#38bdf8;--c3:#a3e635;--c4:#fbbf24;--c5:#a78bfa;--fem:#e879b9;--masc:#60a5fa;--icon-filter:invert(1)}}
:root[data-theme="dark"]{
  --bg:#0c1712;--plane:#14231c;--plane-2:#1a2e25;--stroke:#274034;--ink:#e8f3ed;--ink-2:#b4cbbf;--muted:#8aa498;
  --acc:#34d399;--acc-2:#2dd4bf;--good:#34d399;--bad:#f87171;--warn:#fbbf24;--good-bg:rgba(52,211,153,.12);--track:#23382e;--grid:#1f332a;
  --shadow:0 1px 2px rgba(0,0,0,.3);--c1:#34d399;--c2:#38bdf8;--c3:#a3e635;--c4:#fbbf24;--c5:#a78bfa;--fem:#e879b9;--masc:#60a5fa;--icon-filter:invert(1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{background:var(--plane);border-right:var(--bw) solid var(--stroke);padding:24px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand b{font-family:Fraunces,Georgia,serif;font-size:20px;letter-spacing:-.3px;display:block}
.brand span{font-size:12px;color:var(--muted)}
.lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:500;color:var(--ink-2);font-size:13.5px}
nav button:hover{background:var(--plane-2)}
nav button.on{background:var(--good-bg);color:var(--acc);font-weight:600}
aside a{display:block;color:var(--ink-2);text-decoration:none;padding:6px 0;font-size:13px}
aside a:hover{color:var(--acc)}
main{padding:28px;max-width:1280px;width:100%}
h1.t{font-family:Fraunces,Georgia,serif;font-size:26px;letter-spacing:-.4px;margin-bottom:18px}
.card{background:var(--plane);border:var(--bw) solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
select,input{font:inherit;color:var(--ink);background:var(--plane-2);border:var(--bw) solid var(--stroke);border-radius:8px;padding:8px 10px;width:100%;color-scheme:light dark}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:52px;height:52px;border-radius:10px;background:var(--plane-2);display:grid;place-items:center;flex:none}
.kpi img{width:34px;height:34px;filter:var(--icon-filter)}
.kpi small{color:var(--muted);font-size:12px;font-weight:500;display:block}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.ch{height:300px}.ch.tall{height:340px}
h3{font-size:14px;font-weight:600;margin-bottom:10px}
.tw{overflow:auto;max-height:420px;border:var(--bw) solid var(--stroke);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;white-space:nowrap;border-bottom:var(--bw) solid var(--stroke)}
th{position:sticky;top:0;background:var(--plane-2);font-weight:600;color:var(--ink-2);z-index:1}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:var(--plane-2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;background:var(--acc);color:var(--plane);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px}
.btn:hover{opacity:.9}
.muted{color:var(--muted)}
.prose h2{font-family:Fraunces,Georgia,serif;font-size:20px;margin:22px 0 8px}
.prose p,.prose li{line-height:1.65;color:var(--ink-2)}
.prose ul{padding-left:20px}.prose li{margin:5px 0}
.hero{font-family:Fraunces,Georgia,serif;font-size:30px;letter-spacing:-.5px;line-height:1.15;margin-bottom:12px}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:var(--bw) solid var(--stroke);padding:16px}
  nav{flex-direction:row;flex-wrap:wrap}
  main{padding:16px}.g2,.fgrid{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.kpi b{font-size:21px}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><b id="brand"></b><span>HR Analytics</span></div>
    <div><div class="lbl">Idioma/Language</div>
      <select id="lang"><option value="pt">Português</option><option value="en">English</option></select></div>
    <div><div class="lbl" id="navlbl"></div><nav id="nav"></nav></div>
    <div><div class="lbl" id="linklbl"></div><div id="links"></div></div>
  </aside>
  <main id="main"></main>
</div>

const fmtBR=d=>d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4);
let lang='pt',page='inicio',charts=[];
try{lang=localStorage.getItem('lang')||'pt'}catch(e){}
const L=(p,e)=>lang==='pt'?p:e;
const loc=()=>lang==='pt'?'pt-BR':'en-US';
const num=(v,d=0)=>Number(v).toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d});
const brl=v=>'R$ '+num(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const uniq=k=>[...new Set(ROWS.map(r=>r[k]))].sort((a,b)=>a.localeCompare(b,'pt'));
const ATTR={area:['Área','Department'],posicao:['Posição','Position'],genero:['Gênero','Gender'],formacao:['Formação','Education']};
const $=s=>document.querySelector(s);
const PAGES=[['inicio','Início','Home'],['painel','Painel','Dashboard'],['aposentadoria','Simulador Aposentadoria','Retirement Simulator'],['tabela','Tabela para Extração','Extract Table']];

function disposeCharts(){charts.forEach(c=>c.dispose());charts=[]}
function mkChart(sel,opt){const c=echarts.init($(sel),null,{renderer:'svg'});c.setOption(opt);charts.push(c);return c}
window.addEventListener('resize',()=>charts.forEach(c=>c.resize()));
const baseTip=()=>({backgroundColor:css('--ink'),borderWidth:0,padding:[9,12],textStyle:{color:css('--bg'),fontSize:12,fontFamily:'Inter'},extraCssText:'border-radius:6px'});

/* ---------- chrome ---------- */
function chrome(){
  $('#brand').textContent=L('Relatório de RH','HR Report');
  $('#navlbl').textContent=L('Navegação','Navigation');
  $('#linklbl').textContent=L('Links Úteis','Useful Links');
  $('#nav').innerHTML=PAGES.map(p=>`<button data-p="${p[0]}" class="${p[0]===page?'on':''}">${L(p[1],p[2])}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;go()});
  $('#links').innerHTML=`<a target="_blank" rel="noopener" href="https://www.linkedin.com/in/danilo-barros-machado-data-analyst/">Meu LinkedIn</a><a target="_blank" rel="noopener" href="https://github.com/Danilo875">Meu GitHub</a>`;
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
}

/* ---------- shared pieces ---------- */
function filterPanel(){
  const S=L('Selecione','Select');
  const opt=(a)=>`<option>${S}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('');
  const leaders=[...new Set(ROWS.filter(r=>r.lider).map(r=>r.nome))].sort((a,b)=>a.localeCompare(b,'pt'));
  return `<div class="card"><div class="lbl">${L('Painel de filtros','Filters Panel')}</div><div class="fgrid">
   <label>${L('Líder:','Leader:')}<select id="f-lider">${opt(leaders)}</select></label>
   <label>${L('Área:','Department:')}<select id="f-area">${opt(uniq('area'))}</select></label>
   <label>${L('Gênero:','Gender:')}<select id="f-genero">${opt(uniq('genero'))}</select></label>
   <label>${L('Formação:','Education:')}<select id="f-formacao">${opt(uniq('formacao'))}</select></label></div></div>`;
}
function readFilters(){
  const v=id=>{const s=$(id);return s.selectedIndex===0?null:s.value};
  const f={lider:v('#f-lider'),area:v('#f-area'),genero:v('#f-genero'),formacao:v('#f-formacao')};
  return {f,rows:ROWS.filter(r=>(!f.lider||r.nome===f.lider)&&(!f.area||r.area===f.area)&&(!f.genero||r.genero===f.genero)&&(!f.formacao||r.formacao===f.formacao))};
}
function kpiHTML(vals){
  const k=[['employees',L('Quantidade de Funcionários','Number of Employees')],['leadership',L('Quantidade de Líderes','Number of Managers')],['average',L('Número de Liderados - Média','Span of Control - Avg')],['money',L('Custo com pessoal','People Cost')]];
  return `<div class="g4">`+k.map((x,i)=>`<div class="card kpi"><div class="ic"><img alt="" src="${ICONS[x[0]]}"></div><div><small>${x[1]}</small><b>${vals[i]}</b></div></div>`).join('')+`</div>`;
}
function kpiVals(rows,employees){
  const lid=rows.filter(r=>r.lider).length;
  return [num(employees),num(lid),lid?num(employees/lid,2):'—',brl(rows.reduce((a,r)=>a+r.custo,0))];
}
function tableHTML(cols,rows){
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('')}</tr></thead><tbody>`+
   rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${esc(c.v(r))}</td>`).join('')}</tr>`).join('')+`</tbody></table></div>`;
}
async function saveCSV(name,header,lines){
  const dl=await (window.claude&&claude.use?claude.use('downloads'):null);
  if(!dl){alert(L('Download indisponível neste ambiente.','Download unavailable in this environment.'));return}
  const q=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='\ufeff'+[header,...lines].map(r=>r.map(q).join(';')).join('\r\n');
  try{await dl.save({filename:name,data:csv})}catch(e){}
}
const csvBtn=()=>`<button class="btn" id="csv" hidden>${L('Baixar .csv','Download .csv')}</button>`;
async function enableCsv(fn){
  const b=$('#csv');if(!b)return;
  try{const dl=await claude.use('downloads');if(dl){b.hidden=false;b.onclick=fn}}catch(e){}
}

function pAposentadoria(){
  const today=new Date().toISOString().slice(0,10);
  $('#main').innerHTML=`<h1 class="t">${L('Simulador de Aposentadoria','Retirement Simulator')}</h1><div class="card stack">
   <p>${L('Selecione a idade mínima para aposentadoria no seu país e veja o número de funcionários que atendem aos critérios:','Select the minimum retirement age in your country and see the number of employees who meet the criteria:')}</p>
   <div class="fgrid">
    <label>${L('Masculino:','Male:')}<input id="am" type="number" min="55" max="120" step="1" value="60"></label>
    <label>${L('Feminino:','Female:')}<input id="af" type="number" min="55" max="120" step="1" value="55"></label>
    <label>${L('Selecione uma data para simular cenários futuros:','Select a date to simulate future scenarios:')}<input id="ad" type="date" min="${today}" max="2100-12-31" value="${today}"></label>
    <label>${L('Selecione como quer distribuir os dados:','Select how you want to distribute the data:')}<select id="attr">${['area','posicao','formacao'].map(k=>`<option value="${k}">${ATTR[k][lang==='pt'?0:1]}</option>`).join('')}</select></label></div>
   <div id="xt"></div>
   <div class="row"><h3 style="margin:0">${L('Tabela de funcionários (extração em .csv)','Employee Data Table (exports in .csv)')}</h3>${csvBtn()}</div><div id="tb"></div></div>`;
  let cur=[];
  const upd=()=>{
    const mm=Math.max(55,Math.min(120,+$('#am').value||55)),mf=Math.max(55,Math.min(120,+$('#af').value||55));
    const d=$('#ad').value||today,sim=Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)),at=$('#attr').value;
    const age=r=>Math.floor((sim-r.ts)/864e5/365);
    cur=[...ROWS.filter(r=>r.genero==='Masculino'&&age(r)>=mm),...ROWS.filter(r=>r.genero==='Feminino'&&age(r)>=mf)].map(r=>({...r,idade:age(r)}));
    const m={};cur.forEach(r=>{const o=m[r[at]]||(m[r[at]]={h:0,m:0});r.genero==='Masculino'?o.h++:o.m++});
    const keys=Object.keys(m).sort((a,b)=>a.localeCompare(b,'pt')),H=cur.filter(r=>r.genero==='Masculino').length,M=cur.length-H;
    $('#xt').innerHTML=`<div class="tw" style="max-height:340px"><table><thead><tr><th>${ATTR[at][lang==='pt'?0:1]}</th><th class="n">${L('Homens','Men')}</th><th class="n">${L('Mulheres','Women')}</th><th class="n">Total</th></tr></thead><tbody>`+
      keys.map(k=>`<tr><td>${esc(k)}</td><td class="n">${num(m[k].h)}</td><td class="n">${num(m[k].m)}</td><td class="n">${num(m[k].h+m[k].m)}</td></tr>`).join('')+
      `<tr class="tot"><td>Total</td><td class="n">${num(H)}</td><td class="n">${num(M)}</td><td class="n">${num(H+M)}</td></tr></tbody></table></div>`;
    $('#tb').innerHTML=tableHTML(COLS_R(),cur);
  };
  const COLS_R=()=>[{h:L('Nome','Name'),v:r=>r.nome},{h:L('Área','Department'),v:r=>r.area},{h:L('Posição','Position'),v:r=>r.posicao},{h:L('Gênero','Gender'),v:r=>r.genero},{h:L('Qtd. Liderados','Direct Reports'),n:1,v:r=>r.qtd},{h:L('Idade','Age'),n:1,v:r=>r.idade}];
  $('#main').querySelectorAll('input,select').forEach(s=>s.oninput=upd);upd();
  enableCsv(()=>saveCSV('aposentadoria.csv',COLS_R().map(c=>c.h),cur.map(r=>COLS_R().map(c=>c.v(r)))));
}

function pTabela(){
  $('#main').innerHTML=`<h1 class="t">${L('Tabela para Extração','Export Table')}</h1><div class="stack">${filterPanel()}<div id="kpis"></div>
   <div class="card"><div class="row"><h3 style="margin:0">${L('Tabela de funcionários (extração em .csv)','Employee Data Table (exports in .csv)')}</h3>${csvBtn()}</div><div id="tb"></div></div></div>`;
  const COLS=()=>[{h:L('Nome','Name'),v:r=>r.nome},{h:L('Data de Nascimento','Birth Date'),v:r=>fmtBR(r.nasc)},{h:L('Área','Department'),v:r=>r.area},{h:L('Posição','Position'),v:r=>r.posicao},{h:L('Formação','Education'),v:r=>r.formacao},{h:L('Gênero','Gender'),v:r=>r.genero},{h:L('Qtd. Liderados','# Direct Reports'),n:1,v:r=>r.qtd},{h:L('Custo Mensal','Monthly Cost'),n:1,v:r=>r.custo}];
  let cur=[];
  const upd=()=>{
    const {f,rows}=readFilters();cur=rows;
    $('#kpis').innerHTML=kpiHTML(kpiVals(rows,f.lider?rows.reduce((a,r)=>a+r.qtd,0):rows.length));
    $('#tb').innerHTML=tableHTML(COLS(),rows);
  };
  $('#main').querySelectorAll('select').forEach(s=>s.onchange=upd);upd();
  enableCsv(()=>saveCSV('funcionarios.csv',COLS().map(c=>c.h),cur.map(r=>COLS().map(c=>c.v(r)))));
}
